  <main class="main">
    <section id="contact" class="contact section">
      <div class="container section-title" data-aos="fade-up">

      <div class="container" data-aos="fade-up" data-aos-delay="100">

          <div class="col-lg-5">
            <div class="info-box" data-aos="fade-up" data-aos-delay="200">

              <div class="info-item" data-aos="fade-up" data-aos-delay="300">

                </div>

              <div class="info-item" data-aos="fade-up" data-aos-delay="400">
                <div class="icon-box"><i class="bi bi-telephone"></i></div>

                  <p>+91 8789451534</p>

              </div>
              <div class="info-item" data-aos="fade-up" data-aos-delay="500">
                <div class="icon-box"><i class="bi bi-envelope"></i></div>
                <div class="content">
                  <h4>Email Address</h4>
                  <p>ramroopsinghrs01@gmail.com</p>
                </div>
              </div>

          </div>
          <div class="col-lg-7">
            <div class="contact-form" data-aos="fade-up" data-aos-delay="300">
              <h3>Get In Touch</h3>
              <form id="contactForm">
                <div class="row gy-4">
                  <div class="col-md-6">
                    <input type="text" name="name" class="form-control" placeholder="Your Name" required>
                  </div>
                  <div class="col-md-6">
                    <input type="email" name="email" class="form-control" placeholder="Your Email" required>
                  </div>
                  <div class="col-12">
                    <input type="text" name="subject" class="form-control" placeholder="Subject" required>
                  </div>
                  <div class="col-12">
                    <textarea name="message" class="form-control" rows="6" placeholder="Message" required></textarea>
                  </div>
                  <div class="col-12 text-center">
                    <div class="form-status loading">Sending...</div>
                    <div class="form-status error-message"></div>
                    <div class="form-status sent-message">Your message has been sent. Thank you!</div>
                    <button type="submit" class="btn">Send Message</button>
                  </div>
                </div>
              </form>
            </div>
          </div>
        </div>

  </main>
  <a href="#" id="scroll-top" class="scroll-top d-flex align-items-center justify-content-center"><i class="bi bi-arrow-up-short"></i></a>
  <div id="preloader"></div>
  <script src="assets/vendor/aos/aos.js"></script>
  <script src="assets/js/main.js"></script>

  <script>
  const ACCESS_KEY = "46782955-1623-427a-963a-150d3466df61"; // <-- put your real key here

  document.getElementById('contactForm').addEventListener('submit', async function (e) {
    e.preventDefault();

    const form = this;
    const loading = form.querySelector('.loading');
    const sent = form.querySelector('.sent-message');
    const error = form.querySelector('.error-message');
    const btn = form.querySelector('button[type="submit"]');

    loading.style.display = 'block';
    sent.style.display = 'none';
    error.style.display = 'none';
    btn.disabled = true;

    const payload = {
      access_key: ACCESS_KEY,
      name: form.name.value,
      email: form.email.value,
      subject: form.subject.value,
      message: form.message.value,
      from_name: "Portfolio Contact Form"
    };

    try {
      const res = await fetch('https://api.web3forms.com/submit', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify(payload)
      });

      const data = await res.json();
      loading.style.display = 'none';

      if (data.success) {
        sent.style.display = 'block';
        form.reset();
      } else {
        error.textContent = 'Error: ' + (data.message || 'Submission failed');
        error.style.display = 'block';
        console.error('Web3Forms response:', data);
      }
    } catch (err) {
      loading.style.display = 'none';
      error.textContent = 'Error: ' + err.message;
      error.style.display = 'block';
      console.error(err);
    } finally {
      btn.disabled = false;
    }
  });
</script>


</body>
